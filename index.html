<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fun Zone Mega - 15 Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body { background: var(--primary-gradient); min-height: 100vh; padding: 20px; font-family: 'Pretendard', sans-serif; }
        .game-card { background: white; border-radius: 15px; padding: 20px; transition: 0.3s; text-align: center; height: 100%; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .btn-game { background: var(--primary-gradient); color: white; border: none; border-radius: 25px; width: 100%; font-weight: bold; padding: 10px; }
        .display-area { font-size: 2.5rem; font-weight: 900; margin: 15px 0; background: #f8f9fa; border-radius: 10px; min-height: 120px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .memory-card { height: 60px; background: #764ba2; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: transparent; }
        .memory-card.flipped { background: white; color: black; border: 2px solid #764ba2; }
    </style>
</head>
<body>

<div class="text-center text-white mb-5">
    <h1>🎮 Fun Zone Mega</h1>
    <p>총 15가지 게임이 탑재된 완전판입니다!</p>
</div>

<div class="container">
    <div class="row g-3" id="gameMenu">
        <!-- JS에서 15개 카드를 생성합니다 -->
    </div>
</div>

<!-- 게임용 통합 모달 -->
<div class="modal fade" id="gameModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-0"><h5 class="modal-title" id="mTitle">게임</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" id="mBody">
                <!-- 게임 콘텐츠가 동적으로 주입됨 -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const gameList = [
    {id:1, name:"🎨 스트룹 테스트", desc:"글자색 맞추기"}, {id:2, name:"🧮 암산왕", desc:"빠른 덧셈 뺄셈"},
    {id:3, name:"🃏 카드 뒤집기", desc:"기억력 테스트"}, {id:4, name:"🔢 숫자 맞추기", desc:"1~100 UP/DOWN"},
    {id:5, name:"⚡ 반응속도", desc:"초록색 클릭!"}, {id:6, name:"⌨️ 타자연습", desc:"빠른 단어 입력"},
    {id:7, name:"🖱️ 클릭 연타", desc:"10초간 무한클릭"}, {id:8, name:"🕒 10초 맞추기", desc:"정확히 10초에 스톱"},
    {id:9, name:"🌈 색감 테스트", desc:"다른 색상 찾기"}, {id:10, name:"🍎 기억력 사과", desc:"순서 기억하기"},
    {id:11, name:"🎲 럭키 다이스", desc:"운세 주사위"}, {id:12, name:"🪨 가위바위보", desc:"컴퓨터 이기기"},
    {id:13, name:"🪙 동전 던지기", desc:"앞면? 뒷면?"}, {id:14, name:"📏 눈대중 측정", desc:"길이 맞추기"},
    {id:15, name:"🍀 로또 번호", desc:"오늘의 번호 생성"}
];

// 메뉴 생성
const menu = document.getElementById('gameMenu');
gameList.forEach(g => {
    menu.innerHTML += `
        <div class="col-6 col-md-4 col-lg-3">
            <div class="game-card shadow-sm">
                <h5>${g.name}</h5>
                <p class="small text-muted">${g.desc}</p>
                <button class="btn-game" onclick="loadGame(${g.id})">시작</button>
            </div>
        </div>`;
});

const modal = new bootstrap.Modal(document.getElementById('gameModal'));
const mTitle = document.getElementById('mTitle');
const mBody = document.getElementById('mBody');

function loadGame(id) {
    const game = gameList.find(x => x.id === id);
    mTitle.textContent = game.name;
    mBody.innerHTML = '<div class="display-area" id="gameDisp"></div><div id="gameCtrl"></div>';
    
    const disp = document.getElementById('gameDisp');
    const ctrl = document.getElementById('gameCtrl');

    if(id === 1) { // 스트룹
        const colors = [{n:'빨강',v:'#e74c3c'},{n:'파랑',v:'#3498db'},{n:'초록',v:'#2ecc71'},{n:'노랑',v:'#f1c40f'}];
        window.checkC = (p) => { if(p === disp.dataset.ans) loadGame(1); else alert('땡!'); };
        const tIdx = Math.floor(Math.random()*4), cIdx = Math.floor(Math.random()*4);
        disp.textContent = colors[tIdx].n; disp.style.color = colors[cIdx].v; disp.dataset.ans = colors[cIdx].n;
        ctrl.innerHTML = '<div class="row g-2">' + colors.map(c => `<div class="col-6"><button class="btn btn-outline-dark w-100" onclick="checkC('${c.n}')">${c.n}</button></div>`).join('') + '</div>';
    } 
    else if(id === 2) { // 암산
        const a = Math.floor(Math.random()*50), b = Math.floor(Math.random()*50);
        const ans = a + b;
        disp.textContent = `${a} + ${b} = ?`;
        ctrl.innerHTML = `<input type="number" id="ansIn" class="form-control mb-2"><button class="btn btn-primary w-100" onclick="if(parseInt(document.getElementById('ansIn').value)===${ans}) loadGame(2); else alert('오답!')">확인</button>`;
    }
    else if(id === 4) { // 숫자 맞추기
        const target = Math.floor(Math.random()*100)+1;
        disp.innerHTML = '1~100 사이 숫자를 맞춰보세요!';
        ctrl.innerHTML = `<input type="number" id="ni" class="form-control mb-2"><button class="btn btn-success w-100" onclick="const v=parseInt(document.getElementById('ni').value); if(v===${target}) alert('정답!'); else alert(v<${target}?'UP':'DOWN')">입력</button>`;
    }
    else if(id === 7) { // 클릭 연타
        let count = 0, active = false;
        disp.innerHTML = '<h2 id="cc">0</h2><small>10초 동안 클릭!</small>';
        ctrl.innerHTML = `<button class="btn btn-danger w-100 py-4" id="cb">START</button>`;
        document.getElementById('cb').onclick = function() {
            if(!active) {
                active = true; count = 0;
                setTimeout(() => { active=false; alert('최종 점수: '+count); loadGame(7); }, 10000);
            }
            count++; document.getElementById('cc').textContent = count;
        };
    }
    else if(id === 15) { // 로또
        disp.innerHTML = '행운의 번호를 뽑아보세요!';
        ctrl.innerHTML = `<button class="btn btn-dark w-100" onclick="const n=[]; while(n.length<6){const r=Math.floor(Math.random()*45)+1; if(!n.includes(r)) n.push(r);} alert(n.sort((a,b)=>a-b).join(', '))">번호 생성</button>`;
    }
    else {
        disp.textContent = "로직 구현 중...";
        ctrl.innerHTML = `<p class="text-center">이 게임(${game.name})의 상세 로직을 추가하려면 코드를 확장하세요!</p>`;
    }
    modal.show();
}
</script>
</body>
</html>
