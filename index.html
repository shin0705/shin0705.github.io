<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🎮 Fun Zone - 업그레이드 게임 모음</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            background: var(--primary-gradient);
            min-height: 100vh;
            font-family: 'Pretendard', sans-serif;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto 30px;
        }

        .game-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-10px);
        }

        .btn-game {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            width: 100%;
        }

        /* 색깔 맞추기 게임 강화 */
        .color-display {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* 주사위 애니메이션 강화 */
        .dice-wrap {
            perspective: 600px;
            margin: 30px 0;
        }

        .dice-box {
            font-size: 5rem;
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dice-rolling {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: rotate(0deg) translate(2px, 1px); }
            50% { transform: rotate(10deg) translate(-1px, -2px); }
            100% { transform: rotate(0deg) translate(1px, 2px); }
        }

        .stats-badge {
            background: #eee;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin: 5px;
        }

        .quote-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🎮 Fun Zone</h1>
        <p>심심할 틈이 없는 미니게임 파크</p>
    </div>

    <div class="quote-container">
        <div id="quoteText">"로딩 중..."</div>
        <small id="quoteAuthor"></small>
    </div>

    <div class="games-container">
        <!-- 색깔 맞추기 (업그레이드) -->
        <div class="game-card">
            <h3>🎨 스트룹 테스트</h3>
            <p>글자 내용이 아니라 <b>글자 색상</b>을 맞추세요!</p>
            <button class="btn-game" data-bs-toggle="modal" data-bs-target="#colorGameModal">도전하기</button>
        </div>

        <!-- 주사위 게임 (업그레이드) -->
        <div class="game-card">
            <h3>🎲 럭키 다이스</h3>
            <p>연속으로 높은 숫자가 나올 확률은?</p>
            <button class="btn-game" data-bs-toggle="modal" data-bs-target="#diceGameModal">굴리기</button>
        </div>

        <!-- 나머지 게임들은 구조 유지 -->
        <div class="game-card">
            <h3>🔢 숫자 맞추기</h3>
            <p>1~100 사이의 숫자를 맞춰보세요.</p>
            <button class="btn-game" data-bs-toggle="modal" data-bs-target="#numberGuessModal">시작하기</button>
        </div>

        <div class="game-card">
            <h3>⚡ 반응속도</h3>
            <p>색이 변하는 순간을 포착하세요!</p>
            <button class="btn-game" data-bs-toggle="modal" data-bs-target="#reactionTestModal">측정하기</button>
        </div>
    </div>

    <!-- 색깔 맞추기 모달 -->
    <div class="modal fade" id="colorGameModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🎨 색깔 맞추기 (색상에 집중!)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="color-display" id="colorDisplay">준비</div>
                    <div class="row g-2" id="colorButtonContainer">
                        <!-- 버튼이 JS에서 동적으로 생성됩니다 -->
                    </div>
                    <div class="mt-3">
                        <span class="stats-badge">점수: <strong id="colorScore">0</strong></span>
                        <span class="stats-badge">남은 시간: <strong id="colorTimer">20</strong>s</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 주사위 모달 -->
    <div class="modal fade" id="diceGameModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🎲 럭키 다이스</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="dice-wrap">
                        <div class="dice-box" id="diceBox">🎲</div>
                    </div>
                    <button class="btn btn-dark w-100 mb-3" onclick="rollDice()">주사위 굴리기</button>
                    <div id="diceHistory" class="text-muted small mb-2"></div>
                    <div class="stats">
                        <span class="stats-badge">총합: <strong id="diceTotal">0</strong></span>
                        <span class="stats-badge">최고 기록: <strong id="diceMax">0</strong></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 숫자 맞추기 모달 (유지하되 디자인만 살짝 보정) -->
    <div class="modal fade" id="numberGuessModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🔢 숫자 맞추기</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="number" id="numberInput" class="form-control form-control-lg mb-2" placeholder="1~100">
                    <button class="btn btn-primary w-100" onclick="guessNumber()">확인</button>
                    <div id="numberResult" class="alert mt-3" style="display:none"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 1. 색깔 맞추기 (스트룹 테스트 버전) ==========
        const colorData = [
            { name: '빨강', value: '#e74c3c' },
            { name: '파랑', value: '#3498db' },
            { name: '초록', value: '#2ecc71' },
            { name: '노랑', value: '#f1c40f' },
            { name: '보라', value: '#9b59b6' },
            { name: '검정', value: '#2c3e50' }
        ];

        let colorScore = 0;
        let colorTimeLeft = 20;
        let colorInterval;

        function initColorGame() {
            colorScore = 0;
            colorTimeLeft = 20;
            document.getElementById('colorScore').textContent = '0';
            document.getElementById('colorTimer').textContent = '20';
            clearInterval(colorInterval);
            
            // 버튼 생성
            const container = document.getElementById('colorButtonContainer');
            container.innerHTML = '';
            colorData.forEach((color, idx) => {
                const col = document.createElement('div');
                col.className = 'col-4';
                col.innerHTML = `<button class="btn btn-outline-dark w-100 py-3" onclick="checkColor('${color.name}')">${color.name}</button>`;
                container.appendChild(col);
            });

            nextColorQuiz();
            colorInterval = setInterval(() => {
                colorTimeLeft--;
                document.getElementById('colorTimer').textContent = colorTimeLeft;
                if (colorTimeLeft <= 0) {
                    clearInterval(colorInterval);
                    alert(`게임 종료! 최종 점수: ${colorScore}점`);
                    bootstrap.Modal.getInstance(document.getElementById('colorGameModal')).hide();
                }
            }, 1000);
        }

        function nextColorQuiz() {
            const display = document.getElementById('colorDisplay');
            // 글자 내용은 무작위
            const textIdx = Math.floor(Math.random() * colorData.length);
            // 실제 색상(정답)도 무작위
            const colorIdx = Math.floor(Math.random() * colorData.length);
            
            display.textContent = colorData[textIdx].name;
            display.style.color = colorData[colorIdx].value;
            display.dataset.answer = colorData[colorIdx].name;
        }

        function checkColor(clickedName) {
            const answer = document.getElementById('colorDisplay').dataset.answer;
            if (clickedName === answer) {
                colorScore++;
                document.getElementById('colorScore').textContent = colorScore;
                nextColorQuiz();
            } else {
                colorTimeLeft -= 2; // 틀리면 시간 감점
                nextColorQuiz();
            }
        }

        // ========== 2. 주사위 게임 (애니메이션 버전) ==========
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        let diceTotal = 0;
        let diceMax = 0;

        function rollDice() {
            const diceBox = document.getElementById('diceBox');
            diceBox.classList.add('dice-rolling');
            
            setTimeout(() => {
                const result = Math.floor(Math.random() * 6) + 1;
                diceBox.classList.remove('dice-rolling');
                diceBox.textContent = diceFaces[result - 1];
                
                diceTotal += result;
                if (result > diceMax) diceMax = result;

                document.getElementById('diceTotal').textContent = diceTotal;
                document.getElementById('diceMax').textContent = diceMax;
                
                const history = document.getElementById('diceHistory');
                history.textContent = `최근 기록: ${result} ` + history.textContent.split(' ').slice(0, 5).join(' ');
            }, 600);
        }

        // ========== 3. 숫자 맞추기 (로직 보강) ==========
        let targetNum = 0;
        function initNumberGame() {
            targetNum = Math.floor(Math.random() * 100) + 1;
            const res = document.getElementById('numberResult');
            res.style.display = 'none';
        }

        function guessNumber() {
            const input = document.getElementById('numberInput');
            const res = document.getElementById('numberResult');
            const val = parseInt(input.value);

            res.style.display = 'block';
            if (val === targetNum) {
                res.className = 'alert alert-success';
                res.textContent = "정답입니다! 잠시 후 숫자가 초기화됩니다.";
                setTimeout(initNumberGame, 2000);
            } else {
                res.className = 'alert alert-warning';
                res.textContent = val < targetNum ? "더 큰 숫자예요! ↑" : "더 작은 숫자예요! ↓";
            }
            input.value = '';
        }

        // ========== 공통: 명언 및 이벤트 로드 ==========
        const quotes = [
            { t: "승리는 가장 끈기 있는 자에게 돌아간다.", a: "나폴레옹" },
            { t: "피할 수 없으면 즐겨라.", a: "로버트 엘리엇" },
            { t: "단순한 것이 가장 아름답다.", a: "스티브 잡스" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const q = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quoteText').textContent = `"${q.t}"`;
            document.getElementById('quoteAuthor').textContent = `- ${q.a}`;

            // 모달 이벤트 연결
            document.getElementById('colorGameModal').addEventListener('show.bs.modal', initColorGame);
            document.getElementById('colorGameModal').addEventListener('hide.bs.modal', () => clearInterval(colorInterval));
            document.getElementById('numberGuessModal').addEventListener('show.bs.modal', initNumberGame);
        });
    </script>
</body>

</html>
