<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Zone Mega - 15 Games</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root { --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
body { background: var(--primary-gradient); min-height: 100vh; padding: 20px; }
.game-card { background:white; border-radius:15px; padding:20px; text-align:center; }
.btn-game { background:var(--primary-gradient); color:white; border:none; border-radius:25px; width:100%; }
.display-area { font-size:2rem; margin:15px 0; background:#f8f9fa; border-radius:10px; min-height:120px; display:flex; align-items:center; justify-content:center; flex-direction:column;}
.card-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.memory-card { height:60px; background:#764ba2; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:transparent; cursor:pointer;}
.memory-card.flipped { background:white; color:black; border:2px solid #764ba2;}
</style>
</head>

<body>

<div class="text-center text-white mb-5">
<h1>🎮 Fun Zone Mega</h1>
<p>총 15가지 게임 완성판</p>
</div>

<div class="container">
<div class="row g-3" id="gameMenu"></div>
</div>

<div class="modal fade" id="gameModal">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header border-0">
<h5 id="mTitle"></h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body" id="mBody"></div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const gameList = [
{id:1,name:"🎨 스트룹"},{id:2,name:"🧮 암산"},{id:3,name:"🃏 카드"},{id:4,name:"🔢 숫자"},
{id:5,name:"⚡ 반응"},{id:6,name:"⌨️ 타자"},{id:7,name:"🖱️ 클릭"},
{id:8,name:"🕒 10초"},{id:9,name:"🌈 색찾기"},{id:10,name:"🍎 기억"},
{id:11,name:"🎲 주사위"},{id:12,name:"✌ 가위바위보"},{id:13,name:"🪙 동전"},
{id:14,name:"📏 길이"},{id:15,name:"🍀 로또"}
];

const menu = document.getElementById('gameMenu');
gameList.forEach(g=>{
menu.innerHTML+=`<div class="col-6 col-md-3">
<div class="game-card">
<h5>${g.name}</h5>
<button class="btn-game" onclick="loadGame(${g.id})">시작</button>
</div></div>`;
});

const modal = new bootstrap.Modal(document.getElementById('gameModal'));
const mTitle = document.getElementById('mTitle');
const mBody = document.getElementById('mBody');

function loadGame(id){
mTitle.textContent = gameList.find(g=>g.id===id).name;
mBody.innerHTML='<div class="display-area" id="d"></div><div id="c"></div>';
const d=document.getElementById('d');
const c=document.getElementById('c');

if(id===1){
const colors=['빨강','파랑','초록','노랑'];
const real=colors[Math.floor(Math.random()*4)];
d.textContent=colors[Math.floor(Math.random()*4)];
d.style.color=real;
c.innerHTML=colors.map(x=>`<button class="btn btn-outline-dark m-1" onclick="alert('${real===x?'정답':'오답'}')">${x}</button>`).join('');
}

else if(id===2){
let a=Math.floor(Math.random()*50),b=Math.floor(Math.random()*50);
d.textContent=`${a}+${b}`;
c.innerHTML=`<input id="i" class="form-control"><button onclick="alert(+i.value===${a+b}?'정답':'오답')">확인</button>`;
}

else if(id===3){
let arr=[1,1,2,2,3,3,4,4].sort(()=>Math.random()-0.5);
c.innerHTML='<div class="card-grid">'+arr.map((v,i)=>`<div class="memory-card" onclick="this.classList.add('flipped');this.textContent=${v}">${v}</div>`).join('')+'</div>';
}

else if(id===4){
let t=Math.floor(Math.random()*100);
c.innerHTML=`<input id="i"><button onclick="alert(i.value==${t}?'정답':i.value<${t}?'UP':'DOWN')">확인</button>`;
}

else if(id===5){
d.textContent="기다리세요...";
setTimeout(()=>{d.style.background='green';d.textContent='클릭!';d.onclick=()=>alert('반응 성공');},2000);
}

else if(id===6){
let word="apple";
d.textContent=word;
c.innerHTML=`<input id="i"><button onclick="alert(i.value==='${word}'?'정답':'오답')">확인</button>`;
}

else if(id===7){
let n=0;
c.innerHTML=`<button onclick="n++;this.textContent=n">클릭</button>`;
}

else if(id===8){
let t=Date.now();
c.innerHTML=`<button onclick="alert(Math.abs((Date.now()-t)/1000-10)+'초 오차')">STOP</button>`;
}

else if(id===9){
let base=Math.floor(Math.random()*255);
let diff=base+20;
c.innerHTML=`<div style="display:flex">
<div onclick="alert('오답')" style="flex:1;height:50px;background:rgb(${base},0,0)"></div>
<div onclick="alert('정답')" style="flex:1;height:50px;background:rgb(${diff},0,0)"></div></div>`;
}

else if(id===10){
let seq=[1,2,3];
d.textContent=seq.join(',');
c.innerHTML=`<input id="i"><button onclick="alert(i.value==='${seq.join('')}'?'정답':'오답')">확인</button>`;
}

else if(id===11){
c.innerHTML=`<button onclick="alert(Math.ceil(Math.random()*6))">굴리기</button>`;
}

else if(id===12){
c.innerHTML=`<button onclick="alert('컴:'+['가위','바위','보'][Math.floor(Math.random()*3)])">가위바위보</button>`;
}

else if(id===13){
c.innerHTML=`<button onclick="alert(Math.random()>0.5?'앞':'뒤')">던지기</button>`;
}

else if(id===14){
let t=Math.floor(Math.random()*100);
d.textContent="길이 맞춰봐";
c.innerHTML=`<input id="i"><button onclick="alert(Math.abs(i.value-${t}))">오차</button>`;
}

else if(id===15){
c.innerHTML=`<button onclick="let n=[];while(n.length<6){let r=Math.floor(Math.random()*45)+1;if(!n.includes(r))n.push(r)};alert(n)">생성</button>`;
}

modal.show();
}
</script>

</body>
</html>
