<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🎮 Fun Zone Mega Pack - 12 Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body { background: var(--primary-gradient); min-height: 100vh; padding: 20px; font-family: 'Pretendard', sans-serif; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .game-card { background: white; border-radius: 15px; padding: 20px; transition: 0.3s; text-align: center; height: 100%; border: none; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-game { background: var(--primary-gradient); color: white; border: none; border-radius: 25px; width: 100%; font-weight: bold; padding: 8px; }
        
        /* 공통 게임 스타일 */
        .display-area { font-size: 2.5rem; font-weight: 900; margin: 15px 0; background: #f8f9fa; border-radius: 10px; height: 100px; display: flex; align-items: center; justify-content: center; }
        .stats-badge { background: #eee; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; margin: 2px; display: inline-block; }
        
        /* 타자 게임용 */
        #typingWord { font-size: 2rem; color: #764ba2; }
        /* 똥피하기/클릭하기용 */
        #canvasGame { background: #eee; border-radius: 10px; cursor: crosshair; }
    </style>
</head>
<body>

<div class="header">
    <h1>🎮 Fun Zone Mega</h1>
    <p>총 12가지의 미니게임을 즐겨보세요!</p>
</div>

<div class="container">
    <div class="row g-3">
        <!-- 게임 리스트 12종 -->
        <div class="col-6 col-md-3"><div class="game-card"><h5>🎨 색깔맞추기</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal1">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>🧮 암산왕</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal2">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>🃏 카드찾기</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal3">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>🔢 숫자맞추기</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal4">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>⚡ 반응속도</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal5">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>⌨️ 타자연습</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal6">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>🖱️ 클릭연타</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal7">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>🍎 기억력사과</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal8">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>📏 길이자르기</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal9">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>🌈 색감테스트</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal10">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>🎲 주사위운세</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal11">Go</button></div></div>
        <div class="col-6 col-md-3"><div class="game-card"><h5>🕒 10초맞추기</h5><button class="btn-game" data-bs-toggle="modal" data-bs-target="#modal12">Go</button></div></div>
    </div>
</div>

<!-- 모달 예시 (가장 중요한 색깔맞추기 & 신규 게임 위주) -->
<!-- 1. 색깔 맞추기 (수정완료 버전) -->
<div class="modal fade" id="modal1" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>🎨 색깔맞추기</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body text-center">
    <div class="display-area" id="cDisp">준비</div><div class="row g-2" id="cBtns"></div>
    <div class="mt-3"><span class="stats-badge">점수: <b id="cSc">0</b></span></div>
</div></div></div></div>

<!-- 6. 타자 연습 -->
<div class="modal fade" id="modal6" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>⌨️ 타자연습</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body text-center">
    <div class="display-area" id="tWord">단어</div><input type="text" id="tInput" class="form-control mb-3" placeholder="입력 후 엔터">
    <span class="stats-badge">성공: <b id="tSc">0</b></span>
</div></div></div></div>

<!-- 12. 10초 맞추기 -->
<div class="modal fade" id="modal12" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>🕒 정확히 10초!</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body text-center">
    <h1 id="timerShow">0.00</h1><button class="btn btn-dark w-100 py-3" id="timerBtn">시작</button>
    <p class="mt-3">눈을 감고 10.00초에 멈춰보세요!</p>
</div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// --- [1. 색깔 맞추기] ---
const colors = [{n:'빨강',v:'#ff4d4d'},{n:'파랑',v:'#4d94ff'},{n:'초록',v:'#2ecc71'},{n:'노랑',v:'#f1c40f'}];
let cScore = 0;
function playColor() {
    const tIdx = Math.floor(Math.random()*4), cIdx = Math.floor(Math.random()*4);
    const d = document.getElementById('cDisp');
    d.textContent = colors[tIdx].n; d.style.color = colors[cIdx].v;
    d.dataset.ans = colors[cIdx].n;
    const bBox = document.getElementById('cBtns'); bBox.innerHTML = '';
    colors.forEach(c => {
        const col = document.createElement('div'); col.className = 'col-6';
        col.innerHTML = `<button class="btn btn-outline-dark w-100 py-2" onclick="checkC('${c.n}')">${c.n}</button>`;
        bBox.appendChild(col);
    });
}
function checkC(p) { 
    if(p === document.getElementById('cDisp').dataset.ans) cScore++;
    document.getElementById('cSc').textContent = cScore; playColor(); 
}

// --- [6. 타자 연습] ---
const words = ["사과", "바나나", "대한민국", "프로그래밍", "자바스크립트", "노트북", "강아지", "오렌지"];
let tScore = 0;
function playTyping() {
    const w = words[Math.floor(Math.random()*words.length)];
    document.getElementById('tWord').textContent = w;
    const input = document.getElementById('tInput');
    input.value = ''; input.focus();
}
document.getElementById('tInput').onkeypress = (e) => {
    if(e.key === 'Enter') {
        if(e.target.value === document.getElementById('tWord').textContent) {
            tScore++; document.getElementById('tSc').textContent = tScore; playTyping();
        }
    }
}

// --- [12. 10초 맞추기] ---
let tStart, tRunning = false, tInterval;
document.getElementById('timerBtn').onclick = function() {
    const btn = this; const show = document.getElementById('timerShow');
    if(!tRunning) {
        tStart = Date.now(); tRunning = true; btn.textContent = '그만!!';
        tInterval = setInterval(() => { show.textContent = ((Date.now()-tStart)/1000).toFixed(2); }, 10);
    } else {
        clearInterval(tInterval); tRunning = false; btn.textContent = '다시 시작';
        const final = parseFloat(show.textContent);
        const diff = Math.abs(10 - final);
        alert(`기록: ${final}초 (차이: ${diff.toFixed(2)}초)`);
    }
};

// 모달 오픈 시 실행 이벤트들
document.getElementById('modal1').addEventListener('show.bs.modal', () => { cScore=0; playColor(); });
document.getElementById('modal6').addEventListener('show.bs.modal', () => { tScore=0; playTyping(); });
</script>

</body>
</html>
