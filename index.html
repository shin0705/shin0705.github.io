<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🎮 Fun Zone - 게임 확장판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body { background: var(--primary-gradient); min-height: 100vh; padding: 20px; font-family: 'Pretendard', sans-serif; }
        .game-card { background: white; border-radius: 15px; padding: 25px; transition: 0.3s; text-align: center; height: 100%; border: none; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .color-display { font-size: 3.5rem; font-weight: 900; margin: 20px 0; background: #f8f9fa; border-radius: 10px; height: 120px; display: flex; align-items: center; justify-content: center; }
        .stats-badge { background: #eee; padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; margin: 2px; display: inline-block; }
        .btn-game { background: var(--primary-gradient); color: white; border: none; border-radius: 25px; width: 100%; font-weight: bold; padding: 10px; }
    </style>
</head>
<body>

<div class="container text-center text-white mb-5">
    <h1>🎮 Fun Zone</h1>
    <p>오류 수정 및 새로운 게임이 추가되었습니다!</p>
</div>

<div class="container">
    <div class="row g-4">
        <!-- 1. 색깔 맞추기 (로직 전면 수정) -->
        <div class="col-md-4">
            <div class="game-card shadow">
                <h3>🎨 색깔 맞추기</h3>
                <p>글자 내용이 아닌 <b>눈에 보이는 색상</b>을 고르세요!</p>
                <button class="btn-game" data-bs-toggle="modal" data-bs-target="#colorModal">도전하기</button>
            </div>
        </div>

        <!-- 2. 산수 퀴즈 (신규) -->
        <div class="col-md-4">
            <div class="game-card shadow">
                <h3>🧮 브레인 산수</h3>
                <p>제한 시간 내에 암산을 완료하세요!</p>
                <button class="btn-game" data-bs-toggle="modal" data-bs-target="#mathModal">두뇌 가동</button>
            </div>
        </div>

        <!-- 3. 카드 뒤집기 (신규) -->
        <div class="col-md-4">
            <div class="game-card shadow">
                <h3>🃏 기억력 테스트</h3>
                <p>똑같은 카드 짝을 모두 찾아보세요.</p>
                <button class="btn-game" data-bs-toggle="modal" data-bs-target="#cardModal">기억력 측정</button>
            </div>
        </div>
    </div>
</div>

<!-- [색깔 맞추기 모달] -->
<div class="modal fade" id="colorModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-0"><h5 class="modal-title">🎨 색깔 맞추기</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="color-display" id="colorDisplay">준비</div>
                <div class="row g-2" id="colorBtnBox"></div>
                <div class="mt-3 text-center">
                    <span class="stats-badge">점수: <strong id="cScore">0</strong></span>
                    <span class="stats-badge">남은 시간: <strong id="cTimer">15</strong>s</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- [산수 퀴즈 모달] -->
<div class="modal fade" id="mathModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-0"><h5 class="modal-title">🧮 암산왕</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body text-center">
                <h2 id="mathProblem" class="my-4">Ready?</h2>
                <input type="number" id="mathInput" class="form-control form-control-lg mb-3" placeholder="정답 입력">
                <button class="btn btn-primary w-100" onclick="checkMath()">정답 확인</button>
                <div class="mt-3">
                    <span class="stats-badge">연속 정답: <strong id="mScore">0</strong></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// 1. 색깔 맞추기 로직 (수정됨)
const colorData = [
    { n: '빨강', v: '#e74c3c' }, { n: '파랑', v: '#3498db' },
    { n: '초록', v: '#2ecc71' }, { n: '노랑', v: '#f1c40f' },
    { n: '보라', v: '#9b59b6' }, { n: '검정', v: '#2c3e50' }
];
let cScore = 0, cTime = 15, cInterval;

function startColorGame() {
    cScore = 0; cTime = 15;
    document.getElementById('cScore').textContent = '0';
    nextColorStep();
    clearInterval(cInterval);
    cInterval = setInterval(() => {
        cTime--;
        document.getElementById('cTimer').textContent = cTime;
        if(cTime <= 0) { clearInterval(cInterval); alert(`게임 종료! 점수: ${cScore}`); }
    }, 1000);
}

function nextColorStep() {
    const display = document.getElementById('colorDisplay');
    const textIdx = Math.floor(Math.random() * colorData.length);
    const colorIdx = Math.floor(Math.random() * colorData.length);
    
    display.textContent = colorData[textIdx].n;
    display.style.color = colorData[colorIdx].v;
    display.dataset.ans = colorData[colorIdx].n; // 눈에 보이는 색깔의 이름이 정답

    const btnBox = document.getElementById('colorBtnBox');
    btnBox.innerHTML = '';
    [...colorData].sort(()=>Math.random()-0.5).forEach(c => {
        const col = document.createElement('div');
        col.className = 'col-4';
        // 배경색을 제거하여 텍스트 내용에만 집중하도록 수정
        col.innerHTML = `<button class="btn btn-outline-secondary w-100 py-2" onclick="valColor('${c.n}')">${c.n}</button>`;
        btnBox.appendChild(col);
    });
}

function valColor(pick) {
    if(pick === document.getElementById('colorDisplay').dataset.ans) {
        cScore++;
        document.getElementById('cScore').textContent = cScore;
        nextColorStep();
    } else {
        cTime -= 1; // 오답 시 시간 감점
        nextColorStep();
    }
}

// 2. 산수 퀴즈 로직
let mAns = 0, mScore = 0;
function startMathGame() {
    mScore = 0; document.getElementById('mScore').textContent = '0';
    nextMathStep();
}
function nextMathStep() {
    const a = Math.floor(Math.random() * 50) + 1;
    const b = Math.floor(Math.random() * 50) + 1;
    const op = Math.random() > 0.5 ? '+' : '-';
    mAns = op === '+' ? a + b : a - b;
    document.getElementById('mathProblem').textContent = `${a} ${op} ${b} = ?`;
    document.getElementById('mathInput').value = '';
    document.getElementById('mathInput').focus();
}
function checkMath() {
    const user = parseInt(document.getElementById('mathInput').value);
    if(user === mAns) {
        mScore++;
        document.getElementById('mScore').textContent = mScore;
        nextMathStep();
    } else {
        alert("틀렸어요! 다시 생각해보세요.");
    }
}

// 이벤트 연결
document.getElementById('colorModal').addEventListener('show.bs.modal', startColorGame);
document.getElementById('mathModal').addEventListener('show.bs.modal', startMathGame);
</script>
</body>
</html>
